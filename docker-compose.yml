# Order-to-Cash Automation – Muster GmbH
#
# Services:
#   postgres      one server, four databases: n8n (n8n internals), automation (project data), odoo, twenty
#   redis         n8n queue (DB 0) + Twenty job queue (DB 1)
#   twenty-*      Twenty CRM (server + background worker)
#   n8n-main      editor UI, webhooks, triggers, schedules (does NOT execute workflows)
#   n8n-worker    executes all workflows pulled from Redis
#   n8n-runners   task-runner sidecar for the worker: runs Code node JavaScript in isolation
#   odoo-init     one-shot: initialises the Odoo database + modules on first start
#   odoo          Odoo Community ERP
#
# All secrets come from .env (copy .env.example). Nothing secret lives in this file.

name: o2c

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:2.41.4
  restart: unless-stopped
  environment: &n8n-env
    # --- n8n's own database -------------------------------------------------
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    # --- shared by main + worker (credentials are encrypted with this key) ---
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    # --- queue mode -----------------------------------------------------------
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    # filesystem binary mode is not supported in queue mode -> keep binaries in Postgres
    N8N_DEFAULT_BINARY_DATA_MODE: database
    # --- task runners (Code node sandbox), external mode ----------------------
    N8N_RUNNERS_MODE: external
    N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?set N8N_RUNNERS_AUTH_TOKEN in .env}
    N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    NODE_FUNCTION_ALLOW_BUILTIN: crypto
    # --- URLs / locale ----------------------------------------------------------
    N8N_HOST: localhost
    N8N_PORT: 5678
    N8N_PROTOCOL: http
    WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
    N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
    N8N_SECURE_COOKIE: "false"          # local http only; set true behind HTTPS
    GENERIC_TIMEZONE: Europe/Berlin
    TZ: Europe/Berlin
    # --- housekeeping -----------------------------------------------------------
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: 336        # hours (14 days)
    # --- non-secret project settings, read in workflows via $env ---------------
    # (env access in expressions is on by default; see docs/SETUP.md "Security notes")
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    # file nodes may only read the chatbot knowledge base (WF-05a)
    N8N_RESTRICT_FILE_ACCESS_TO: /knowledge-base
    LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
    LLM_MODEL: ${LLM_MODEL:-openai/gpt-4.1-mini}
    LLM_VISION_MODEL: ${LLM_VISION_MODEL:-openai/gpt-4.1-mini}
    LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-openai/text-embedding-3-small}
    LEAD_WEBHOOK_HMAC_SECRET: ${LEAD_WEBHOOK_HMAC_SECRET:?set LEAD_WEBHOOK_HMAC_SECRET in .env}
    TWENTY_WEBHOOK_SECRET: ${TWENTY_WEBHOOK_SECRET:?set TWENTY_WEBHOOK_SECRET in .env}
    # where Twenty delivers opportunity events (container-to-container)
    TWENTY_WEBHOOK_TARGET_URL: http://n8n-main:5678/webhook/twenty-opportunity
    ODOO_URL: http://odoo:8069
    ODOO_DB: odoo
    TWENTY_URL: http://twenty-server:3000
    TWENTY_PUBLIC_URL: ${TWENTY_PUBLIC_URL:-http://localhost:3000}   # links in emails
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@example.com}
    HOT_LEAD_THRESHOLD: ${HOT_LEAD_THRESHOLD:-70}
    DOC_CONFIDENCE_THRESHOLD: ${DOC_CONFIDENCE_THRESHOLD:-0.85}
    INVOICE_MAIL_QUERY: ${INVOICE_MAIL_QUERY:?set INVOICE_MAIL_QUERY in .env}
    DOC_UPLOAD_TOKEN: ${DOC_UPLOAD_TOKEN:?set DOC_UPLOAD_TOKEN in .env}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # read by db/init.sql via \getenv (only on first start with an empty volume)
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      AUTOMATION_DB_PASSWORD: ${AUTOMATION_DB_PASSWORD:?set AUTOMATION_DB_PASSWORD in .env}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
      TWENTY_DB_PASSWORD: ${TWENTY_DB_PASSWORD:?set TWENTY_DB_PASSWORD in .env}
      TZ: Europe/Berlin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"   # for psql / DB tools on the host
    healthcheck:
      # -h forces TCP: during first-run init Postgres only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d automation"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    # noeviction: both n8n (Bull) and Twenty (BullMQ) must never lose queued jobs
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n-main:
    <<: *n8n-common
    ports:
      - "5678:5678"
    volumes:
      - n8n_main_data:/home/node/.n8n
      - ./workflows:/workflows
      - ./knowledge-base:/knowledge-base:ro

  n8n-worker:
    <<: *n8n-common
    command: worker
    volumes:
      - n8n_worker_data:/home/node/.n8n
      - ./knowledge-base:/knowledge-base:ro
    depends_on:
      n8n-main:
        condition: service_started

  # Task-runner sidecars: Code node JavaScript runs here, isolated from n8n.
  # Each n8n process has its own broker, so each gets its own runner.
  n8n-runners:                           # for the worker (all normal executions)
    image: n8nio/runners:2.41.4          # must match the n8n version
    restart: unless-stopped
    environment: &runners-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 15
      GENERIC_TIMEZONE: Europe/Berlin
    volumes: &runners-volumes
      # launcher config: allowlists the `crypto` builtin for the Code node
      - ./config/n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    depends_on:
      - n8n-worker

  n8n-runners-main:                      # for main (CLI `n8n execute`, partial runs)
    image: n8nio/runners:2.41.4
    restart: unless-stopped
    environment:
      <<: *runners-env
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-main:5679
    volumes: *runners-volumes
    depends_on:
      - n8n-main

  odoo-init:
    image: odoo:19.0-20260926
    environment: &odoo-env
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
    # 1. installs any missing module (on the first start: all of them)
    # 2. runs db/odoo-setup.py: company Muster GmbH (DE, EUR, SKR03) + products
    # Both steps are idempotent, so this runs on every `docker compose up`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        DB_ARGS="--db_host=$$HOST --db_port=$$PORT --db_user=$$USER --db_password=$$PASSWORD -d odoo"
        MODULES="base contacts sale_management account l10n_de"
        installed=$$(PGPASSWORD="$$PASSWORD" psql -h "$$HOST" -U "$$USER" -d odoo -tA \
          -c "select name from ir_module_module where state='installed'" 2>/dev/null || true)
        missing=""
        for m in $$MODULES; do
          echo "$$installed" | grep -qx "$$m" || missing="$$missing,$$m"
        done
        if [ -n "$$missing" ]; then
          echo "Installing Odoo modules: $${missing#,}"
          # Odoo 19 installs no demo data by default
          odoo $$DB_ARGS -i "$${missing#,}" --stop-after-init
        else
          echo "All Odoo modules installed."
        fi
        odoo shell $$DB_ARGS --no-http --log-level=warn < /setup/odoo-setup.py
    volumes:
      - odoo_data:/var/lib/odoo
      - ./db/odoo-setup.py:/setup/odoo-setup.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  odoo:
    image: odoo:19.0-20260926
    restart: unless-stopped
    environment: *odoo-env
    command: ["odoo", "-d", "odoo", "--db-filter=^odoo$$", "--no-database-list", "--proxy-mode", "--http-interface=0.0.0.0"]
    ports:
      - "8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo
    depends_on:
      odoo-init:
        condition: service_completed_successfully

  twenty-server:
    image: twentycrm/twenty:v2.43.0
    restart: unless-stopped
    environment: &twenty-env
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD}@postgres:5432/twenty
      SERVER_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379/1          # logical DB 1 – n8n's queue uses DB 0
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY in .env}
      # Twenty blocks webhooks to private IPs (SSRF protection). Allow only n8n.
      OUTBOUND_HTTP_ALLOWED_INTERNAL_HOSTS: n8n-main
      TZ: Europe/Berlin
    ports:
      - "3000:3000"
    volumes:
      - twenty_data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  twenty-worker:
    image: twentycrm/twenty:v2.43.0
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"            # the server runs migrations
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_data:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_main_data:
  n8n_worker_data:
  odoo_data:
  twenty_data:
